name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.21', '1.22', '1.23']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Prepare dependencies
        run: go mod download
      - name: Verify generated sources
        run: make check-generated
      - name: go vet
        run: go vet ./...
      - name: go test
        run: make test
      - name: Repeat public contracts
        if: matrix.go == '1.23'
        run: make test-contract
      # Consumer subprocess execution is not included in this coverage profile.
      - name: Coverage observation (parent test processes)
        if: matrix.go == '1.23'
        run: go test -count=1 -covermode=atomic -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@v4
        if: matrix.go == '1.23'
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.2
          args: --timeout=5m
